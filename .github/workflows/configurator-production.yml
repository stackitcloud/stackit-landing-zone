name: Configurator Production Release

on:
  workflow_dispatch:
    inputs:
      publish:
        description: Publish a new release; false redeploys an existing published release
        type: boolean
        default: true
      version:
        description: Stable GitHub Release tag
        type: string
        default: v2.1.0
        required: true
      release_run_id:
        description: Successful Configurator Release run (with or without Dev deployment); reuse its immutable build
        type: string
        required: false
      release_mode:
        description: Assistant qualification policy recorded in the published manifest
        type: choice
        default: skip
        options: [skip, qualified]
  release:
    types: [published]

permissions:
  contents: read
  actions: read
  attestations: read

concurrency:
  group: configurator-lzc-prod-mutation
  cancel-in-progress: false

env:
  LZC_ENVIRONMENT: lzc-prod
  LZC_RELEASE_TAG: ${{ inputs.version || github.event.release.tag_name }}

jobs:
  publish:
    if: github.event_name == 'workflow_dispatch' && inputs.publish && github.ref == 'refs/heads/main' && github.run_attempt == 1
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      actions: read
      id-token: write
      attestations: write
    defaults:
      run:
        working-directory: landing-zone-configurator
    env:
      GH_TOKEN: ${{ github.token }}
      LZC_RELEASE_MODE: ${{ inputs.release_mode }}
      LZC_RELEASE_RUN_ID: ${{ inputs.release_run_id }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '24.21.0'
      - name: Install pinned GitHub CLI for attestation verification
        run: bash infra/ci/install-github-cli.sh
      - name: Resolve trusted immutable build
        id: source
        run: node infra/ci/release-artifact.mjs source
      - name: Bind publication to this reviewed main revision
        env:
          REVISION: ${{ steps.source.outputs.release_revision }}
        run: test "$REVISION" = "$GITHUB_SHA"
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          artifact-ids: ${{ steps.source.outputs.artifact_id }}
          run-id: ${{ inputs.release_run_id }}
          github-token: ${{ github.token }}
          merge-multiple: true
          path: landing-zone-configurator/.local
      - name: Verify and bind release assets
        env:
          LZC_RELEASE_REVISION: ${{ steps.source.outputs.release_revision }}
        run: |
          (cd .local && sha256sum --check configurator-release.sha256)
          tar -xzf .local/configurator-release.tar.gz -C .local
          node infra/ci/production-release.mjs metadata
          node infra/ci/buildpack-source.mjs
      - name: Attest exact release assets
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8
        with:
          subject-path: |
            landing-zone-configurator/.local/configurator-release.tar.gz
            landing-zone-configurator/.local/production-release.json
      - name: Publish versioned release with concise notes
        env:
          REVISION: ${{ steps.source.outputs.release_revision }}
        run: |
          node infra/ci/release-notes.mjs > "$RUNNER_TEMP/release-notes.md"
          gh release create "$LZC_RELEASE_TAG" .local/configurator-release.tar.gz .local/configurator-release.sha256 .local/production-release.json --target "$REVISION" --title "$LZC_RELEASE_TAG" --notes-file "$RUNNER_TEMP/release-notes.md"

  source:
    needs: publish
    if: always() && !cancelled() && github.run_attempt == 1 && (needs.publish.result == 'success' || github.event_name == 'workflow_dispatch' && !inputs.publish && github.ref == 'refs/heads/main' || github.event_name == 'release' && github.event.release.prerelease == false && github.event.release.draft == false)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      revision: ${{ steps.source.outputs.revision }}
      run_id: ${{ steps.source.outputs.run_id }}
      mode: ${{ steps.source.outputs.mode }}
    defaults:
      run:
        working-directory: landing-zone-configurator
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '24.21.0'
      - name: Install pinned GitHub CLI for attestation verification
        run: bash infra/ci/install-github-cli.sh
      - name: Read published release binding
        id: source
        run: |
          mkdir -p .local
          gh release download "$LZC_RELEASE_TAG" --pattern production-release.json --dir .local
          node infra/ci/production-release.mjs source

  deploy:
    needs: source
    if: always() && !cancelled() && needs.source.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 100
    environment:
      name: lzc-prod-release
      url: https://app.landing-zone.runs.onstackit.cloud
    defaults:
      run:
        working-directory: landing-zone-configurator
    env:
      GH_TOKEN: ${{ github.token }}
      LZC_PUBLISHED_RELEASE: 'true'
      LZC_PROJECT_ID: ${{ vars.LZC_PROJECT_ID }}
      LZC_RELEASE_REVISION: ${{ needs.source.outputs.revision }}
      LZC_RELEASE_RUN_ID: ${{ needs.source.outputs.run_id }}
      LZC_RELEASE_MODE: ${{ needs.source.outputs.mode }}
      CF_STAGING_TIMEOUT: '15'
      CF_STARTUP_TIMEOUT: '5'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ needs.source.outputs.revision }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '24.21.0'
      - name: Install pinned GitHub CLI for attestation verification
        run: bash infra/ci/install-github-cli.sh
      - name: Download immutable published assets
        run: |
          mkdir -p .local
          gh release download "$LZC_RELEASE_TAG" --pattern configurator-release.tar.gz --pattern configurator-release.sha256 --dir .local
          (cd .local && sha256sum --check configurator-release.sha256)
          gh attestation verify .local/configurator-release.tar.gz --repo "$GITHUB_REPOSITORY" --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/configurator-production.yml" --source-ref refs/heads/main --source-digest "$LZC_RELEASE_REVISION" --signer-digest "$LZC_RELEASE_REVISION" --deny-self-hosted-runners
          tar -xzf .local/configurator-release.tar.gz -C .local
          node infra/ci/release-artifact.mjs verify .local
          node infra/ci/buildpack-source.mjs
          (cd .local && sha256sum --check release.sha256 && sha256sum --check runner.sha256)
          mkdir -p .local/release .local/runner
          tar -xzf .local/release.tar.gz -C .local/release
          tar -xzf .local/runner.tar.gz -C .local/runner
          diff -qr .local/release/inspection .local/runner
          node infra/ci/package-migration.mjs .local/release .local/migration
      - name: Install pinned CF CLI
        run: |
          curl --fail --silent --show-error --location --retry 3 https://github.com/cloudfoundry/cli/releases/download/v8.17.0/cf8-cli_8.17.0_linux_x86-64.tgz -o "$RUNNER_TEMP/cf.tgz"
          echo "922b91e5651d141ff8756e631adc613c820610c84dcae6cb59f57e22ae073112  $RUNNER_TEMP/cf.tgz" | sha256sum --check
          mkdir -p "$RUNNER_TEMP/cf-bin"
          tar -xzf "$RUNNER_TEMP/cf.tgz" -C "$RUNNER_TEMP/cf-bin" cf8
          ln -s cf8 "$RUNNER_TEMP/cf-bin/cf"
          echo "$RUNNER_TEMP/cf-bin" >> "$GITHUB_PATH"
      - name: Prepare only scoped published bindings
        run: node infra/ci/prepare-release.mjs backend
        env:
          # Release holds no state keys, S3 credentials or organization-manager accounts.
          LZC_RELEASE_BINDINGS: ${{ secrets.LZC_RELEASE_BINDINGS }}
          LZC_PROJECT_ID: ${{ vars.LZC_PROJECT_ID }}
      - name: Prepare authenticated production runtime
        run: |
          test -n "$LZC_MAILOUT_BINDINGS"
          node infra/ci/prepare-release.mjs application
        env:
          LZC_MAILOUT_BINDINGS: ${{ secrets.LZC_MAILOUT_BINDINGS }}
          LZC_AUTH_ENABLED: 'true'
          LZC_ASSISTANT_ENABLED: 'true'
          LZC_STACKIT_DEVICE_ENABLED: 'true'
          LZC_STACKIT_CLI_CLIENT_APPROVED: 'false'
          LZC_STACKIT_AUTH_FLOW: authorization-code
          LZC_STACKIT_CLIENT_ID: ${{ vars.LZC_STACKIT_CLIENT_ID }}
          LZC_STACKIT_REDIRECT_URI: https://app.landing-zone.runs.onstackit.cloud/auth/stackit/callback
          LZC_EXECUTION_ENABLED: 'true'
          LZC_APPLICATION_EXECUTION_ENABLED: 'true'
          LZC_RETIREMENTS_ENABLED: ${{ vars.LZC_RETIREMENTS_ENABLED }}
          LZC_RUNNER_POOL_SIZE: '2'
          LZC_DEPLOYMENT_ARTIFACT_KEY: ${{ secrets.LZC_DEPLOYMENT_ARTIFACT_KEY }}
      - name: Login with application-space deployer
        env:
          LZC_FEATURE_OPERATOR_PROJECT_ID: ${{ vars.LZC_PROJECT_ID }}
        run: |
          cf api "$CF_API_URL"
          cf auth
          cf target -o "$LZC_CF_ORG_NAME" -s configurator
          test "$(cf space configurator --guid)" = "$LZC_CF_SPACE_ID"
          # BEGIN GENERATED RUNTIME FEATURE POLICY
          node --input-type=module <<'LZC_RUNTIME_FEATURES'
          // Embedded into both deployment workflows so rollback of an older application
          // still preserves the current operator policy. Regenerate with embed-runtime-features.mjs.
          import { readFileSync, writeFileSync, lstatSync } from "node:fs";
          import { spawnSync } from "node:child_process";
          import { join } from "node:path";
          import { pathToFileURL } from "node:url";

          export const featureKeys = ["LZC_RETIREMENTS_ENABLED", "LZC_ASSISTANT_ENABLED", "LZC_MAILOUT_ENABLED"];
          const uuid = /^[a-f0-9]{8}(?:-[a-f0-9]{4}){3}-[a-f0-9]{12}$/;
          function boolean(value) {
            if (value !== "true" && value !== "false") throw new Error("Runtime feature values must be true or false");
            return value;
          }
          function projectIds(value) {
            const ids = JSON.parse(value ?? "[]");
            if (!Array.isArray(ids) || ids.length > 32 || ids.some(id => typeof id !== "string" || !uuid.test(id)))
              throw new Error("Invalid retirement control projects");
            return ids;
          }
          export function featureVariables(requested, current, operatorProjectId) {
            if (!uuid.test(operatorProjectId ?? "")) throw new Error("Runtime feature policy requires the operator project ID");
            const result = { ...requested };
            for (const key of featureKeys) result[key] = boolean(Object.hasOwn(current, key) ? current[key] : requested[key] ?? "false");
            if (result.LZC_ASSISTANT_ENABLED === "true" && (result.LZC_AUTH_ENABLED !== "true" || !result.LZC_MODEL_SERVING_TOKEN))
              throw new Error("Assistant runtime prerequisites unavailable");
            if (result.LZC_MAILOUT_ENABLED === "true" && ["LZC_MAILOUT_HOST", "LZC_MAILOUT_PORT", "LZC_MAILOUT_USERNAME", "LZC_MAILOUT_PASSWORD", "LZC_MAILOUT_FROM", "LZC_DEPLOYMENT_ARTIFACT_KEY"].some(key => !result[key]))
              throw new Error("MailOut runtime prerequisites unavailable");
            if (result.LZC_RETIREMENTS_ENABLED === "true" && (result.LZC_EXECUTION_ENABLED !== "true" || result.LZC_APPLICATION_EXECUTION_ENABLED !== "true" || !result.LZC_DEPLOYMENT_ARTIFACT_KEY))
              throw new Error("Retirement runtime prerequisites unavailable");
            const controls = [...new Set([operatorProjectId, ...projectIds(requested.LZC_RETIREMENT_CONTROL_PROJECT_IDS), ...projectIds(current.LZC_RETIREMENT_CONTROL_PROJECT_IDS)])];
            if (controls.length > 32) throw new Error("Too many retirement control projects");
            result.LZC_RETIREMENT_CONTROL_PROJECT_IDS = JSON.stringify(controls);
            return result;
          }
          export function preserveRuntimeFeatures({ directory, spaceId, operatorProjectId, cf }) {
            if (!uuid.test(spaceId ?? "")) throw new Error("Invalid runtime feature target space");
            const appFile = join(directory, "app-vars.json"), stageFile = join(directory, "app-stage-vars.json");
            for (const file of [appFile, stageFile]) {
              const stat = lstatSync(file);
              if (!stat.isFile() || (stat.mode & 0o077) !== 0 || stat.uid !== process.getuid()) throw new Error("Private feature variable files required");
            }
            const requested = JSON.parse(readFileSync(appFile, "utf8"));
            const stage = JSON.parse(readFileSync(stageFile, "utf8"));
            const apps = cf(["curl", `/v3/apps?names=landing-zone-configurator&space_guids=${spaceId}`]);
            if (!Array.isArray(apps.resources) || apps.resources.length > 1 || (apps.pagination?.total_results ?? apps.resources.length) !== apps.resources.length)
              throw new Error("Runtime feature application lookup failed");
            let current = {};
            if (apps.resources.length) {
              const app = apps.resources[0];
              if (app.name !== "landing-zone-configurator" || !uuid.test(app.guid) || app.relationships?.space?.data?.guid !== spaceId) throw new Error("Runtime feature application target mismatch");
              current = cf(["curl", `/v3/apps/${app.guid}/environment_variables`]).var;
              if (!current || typeof current !== "object" || Array.isArray(current)) throw new Error("Runtime feature environment lookup failed");
            }
            const active = featureVariables(requested, current, operatorProjectId);
            // Preserve only explicit feature choices and protected project IDs. Secrets,
            // origins, authentication and execution permissions always use the reviewed release.
            const suspended = { ...stage, LZC_EXECUTION_ENABLED: "false", LZC_APPLICATION_EXECUTION_ENABLED: "false", LZC_RUNNER_POOL_SIZE: "0" };
            for (const key of featureKeys) suspended[key] = "false";
            writeFileSync(appFile, JSON.stringify(active), { mode: 0o600 });
            writeFileSync(stageFile, JSON.stringify(suspended), { mode: 0o600 });
            return Object.fromEntries(featureKeys.map(key => [key, active[key]]));
          }
          if (process.argv[1] === "-" || (process.argv[1] && import.meta.url === pathToFileURL(process.argv[1]).href)) {
            try {
              const flags = preserveRuntimeFeatures({ directory: process.env.LZC_PRIVATE, spaceId: process.env.LZC_CF_SPACE_ID, operatorProjectId: process.env.LZC_FEATURE_OPERATOR_PROJECT_ID, cf(args) {
                const result = spawnSync("cf", args, { encoding: "utf8", timeout: 45_000, maxBuffer: 4 * 1024 * 1024 });
                if (result.status !== 0) throw new Error("CF feature lookup failed");
                return JSON.parse(result.stdout);
              } });
              console.log(JSON.stringify({ event: "runtime_features_preserved", flags }));
            } catch {
              // CF responses and private variable files can contain credentials. Never log them.
              console.error("Runtime feature policy could not be verified; deployment stopped before staging.");
              process.exitCode = 1;
            }
          }
          LZC_RUNTIME_FEATURES
          # END GENERATED RUNTIME FEATURE POLICY
      - name: Stage runner, migration and application
        run: node infra/ci/run-parallel.mjs runner 'bash infra/ci/stage-release-runner.sh' migration 'bash infra/ci/stage-release-migration.sh' application 'bash infra/ci/stage-release-application.sh'
      - name: Activate verified droplet with rolling deployment
        run: node infra/ci/activate-release.mjs
      - name: Check public TLS, authentication and tenant boundary
        run: node infra/ci/check-production-route.mjs
      - name: Verify runtime service and isolated Runner connections
        run: |
          node infra/ci/verify-mailout-binding.mjs
          cf run-task landing-zone-configurator --command './runtime/bin/node apps/api/dist/check-connections.js' --name "connections-$GITHUB_RUN_ID" -m 128M -k 4096M --wait
          cf run-task landing-zone-configurator --command "./runtime/bin/node apps/api/dist/check-plan-runner.js $GITHUB_RUN_ID" --name "runner-$GITHUB_RUN_ID" -m 128M -k 4096M --wait
          for attempt in 1 2 3; do
            if cf logs landing-zone-configurator --recent | node infra/ci/runner-evidence.mjs "$GITHUB_RUN_ID" 2; then break; fi
            test "$attempt" -lt 3 || exit 1
            sleep 5
          done
      - name: Remove private inputs and privileged migration application
        if: always()
        run: |
          if [ -d "$RUNNER_TEMP/lzc-release/cf-migration" ]; then
            CF_HOME="$RUNNER_TEMP/lzc-release/cf-migration" cf delete landing-zone-configurator-migrate -f
          fi
          rm -rf -- "$RUNNER_TEMP/lzc-release"
