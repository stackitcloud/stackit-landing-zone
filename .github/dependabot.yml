version: 2
updates:
  - package-ecosystem: "terraform"
    directories:
      - "/src"
      - "/src/modules/*"
    schedule:
      interval: "weekly"
      day: "sunday"
    groups:
      terraform-providers:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "sunday"
    groups:
      github-actions:
        patterns:
          - "*"
