  <rect x="704" y="530" width="198" height="52" rx="9" fill="#eef9f2" stroke="#b8dfc5"/><text x="803" y="552" text-anchor="middle" class="tag">Transfer network</text><text x="803" y="571" text-anchor="middle" class="small">10.1.0.0/24</text>
  <rect x="455" y="655" width="470" height="140" rx="18" fill="#fff" stroke="#9bd2b1" stroke-width="2"/>
