  <rect x="82" y="128" width="1436" height="62" rx="14" fill="#edf2f7" stroke="#cad8e3"/>
  <text x="105" y="153" class="label">Folders</text>
  <rect x="330" y="141" width="230" height="36" rx="9" fill="#e7f7fa" stroke="#00a6b8"/><text x="445" y="164" text-anchor="middle" class="tag">platform</text>
  <rect x="920" y="141" width="280" height="36" rx="9" fill="#f0fbf3" stroke="#27a667"/><text x="1060" y="164" text-anchor="middle" class="tag">landing_zones_corporate</text>
