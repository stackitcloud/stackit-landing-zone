  <path d="M445 177V205H692V232" class="structure" marker-end="url(#arrow-gray)"/>
  <path d="M1060 177V205H1003V232" class="structure" marker-end="url(#arrow-gray)"/>
  <path d="M1060 177V205H1238V232" class="structure" marker-end="url(#arrow-gray)"/>

