  <rect x="82" y="455" width="276" height="180" rx="18" fill="#fff" stroke="#9ed6df" stroke-width="2"/>
  <use href="#management" x="104" y="478" width="32" height="32"/><text x="148" y="501" class="label">Management</text>
  <rect x="104" y="535" width="232" height="64" rx="9" fill="#eef8fa" stroke="#b8dfe5"/><text x="220" y="559" text-anchor="middle" class="tag">Organization controls</text><text x="220" y="579" text-anchor="middle" class="small">common policy and automation</text>
  <rect x="82" y="670" width="276" height="122" rx="14" fill="#fff" stroke="#9ed6df" stroke-width="2"/>
  <use href="#shield" x="104" y="694" width="30" height="30"/><text x="220" y="704" text-anchor="middle" class="label">Independent owners</text><text x="220" y="731" text-anchor="middle" class="small">finance-platform@example.com</text><text x="220" y="753" text-anchor="middle" class="small">research-platform@example.com</text>

