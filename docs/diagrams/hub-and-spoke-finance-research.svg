  <rect x="1045" y="455" width="470" height="150" rx="18" fill="#fff" stroke="#b8c0eb" stroke-width="2"/>
  <use href="#network" x="1068" y="478" width="32" height="32"/><text x="1112" y="501" class="label">Research Connectivity</text>
  <rect x="1068" y="530" width="210" height="52" rx="9" fill="#f5f6ff" stroke="#cdd2ef"/><text x="1173" y="552" text-anchor="middle" class="tag">research-sna</text><text x="1173" y="571" text-anchor="middle" class="small">10.2.0.0/16</text>
  <rect x="1294" y="530" width="198" height="52" rx="9" fill="#f5f6ff" stroke="#cdd2ef"/><text x="1393" y="552" text-anchor="middle" class="tag">Transfer network</text><text x="1393" y="571" text-anchor="middle" class="small">10.3.0.0/24</text>
  <rect x="1045" y="655" width="470" height="140" rx="18" fill="#fff" stroke="#b8c0eb" stroke-width="2"/>
  <use href="#app" x="1068" y="678" width="32" height="32"/><text x="1112" y="701" class="label">Research Workload</text>
  <text x="1068" y="735" class="small">Corporate / prod / prefix 24</text>
  <rect x="1280" y="700" width="212" height="54" rx="9" fill="#f5f6ff" stroke="#cdd2ef"/><text x="1386" y="724" text-anchor="middle" class="tag">Private project network</text><text x="1386" y="743" text-anchor="middle" class="small">network_area_key research</text>
  <path d="M1386 700V625H1173V582" class="private-flow" marker-end="url(#arrow-teal)"/>

  <path d="M985 380V815" class="boundary"/>
  <rect x="960" y="470" width="50" height="148" rx="25" fill="#f7fafc" stroke="#708397"/>
  <text x="985" y="505" text-anchor="middle" class="tag">NO</text><text x="985" y="531" text-anchor="middle" class="tag">CROSS</text><text x="985" y="557" text-anchor="middle" class="tag">SNA</text><text x="985" y="583" text-anchor="middle" class="tag">ROUTE</text>
  <g transform="translate(76 905)">
    <line x1="0" y1="0" x2="38" y2="0" class="private-flow"/><text x="50" y="5" class="small">private traffic inside each domain</text>
    <line x1="300" y1="0" x2="338" y2="0" class="boundary"/><text x="350" y="5" class="small">no private connection between domains</text>
