  <rect x="690" y="700" width="212" height="54" rx="9" fill="#eef9f2" stroke="#b8dfc5"/><text x="796" y="724" text-anchor="middle" class="tag">Private project network</text><text x="796" y="743" text-anchor="middle" class="small">network_area_key finance</text>
