<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 930" role="img" aria-labelledby="title desc">
  <title id="title">Hub-and-spoke landing zone topology</title>
  <desc id="desc">A shared STACKIT Network Area connects a corporate Data Platform landing zone to a connectivity hub and central DNS. A public External API Gateway landing zone remains independent.</desc>
  <defs>
    <style>
      .title { font: 700 28px Arial, sans-serif; fill: #10213b; }
      .heading { font: 700 20px Arial, sans-serif; fill: #10213b; }
      .label { font: 700 16px Arial, sans-serif; fill: #10213b; }
      .small { font: 400 13px Arial, sans-serif; fill: #53657b; }
      .tag { font: 700 12px Arial, sans-serif; fill: #10213b; }
      .icon { fill: none; stroke: #0b4b70; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
      .structure { fill: none; stroke: #51657c; stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; }
      .private-flow { fill: none; stroke: #00a6b8; stroke-width: 4; stroke-linecap: round; stroke-linejoin: round; }
      .public-flow { fill: none; stroke: #ed8b24; stroke-width: 4; stroke-linecap: round; stroke-linejoin: round; }
    </style>
    <marker id="arrow-gray" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#51657c"/></marker>
    <marker id="arrow-teal" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#00a6b8"/></marker>
    <marker id="arrow-orange" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#ed8b24"/></marker>
    <symbol id="folder" viewBox="0 0 32 32"><path class="icon" d="M3 9h10l3 3h13v14H3zM3 12h26"/></symbol>
    <symbol id="management" viewBox="0 0 32 32"><path class="icon" d="M5 9h22v17H5zM9 6h14v3M10 15h12M10 20h8"/></symbol>
    <symbol id="network" viewBox="0 0 32 32"><path class="icon" d="M16 5v22M6 11l10 5l10-5M6 21l10-5l10 5M4 8h4v5H4zm20 0h4v5h-4zM14 24h4v4h-4z"/></symbol>
    <symbol id="app" viewBox="0 0 32 32"><rect class="icon" x="5" y="5" width="22" height="22" rx="4"/><path class="icon" d="M10 13h12M10 19h7"/></symbol>
    <symbol id="sandbox" viewBox="0 0 32 32"><path class="icon" d="M5 12h22l-3 14H8zM9 12V8h14v4M11 18h10"/></symbol>
    <symbol id="internet" viewBox="0 0 32 32"><circle class="icon" cx="16" cy="16" r="12"/><path class="icon" d="M4 16h24M16 4c4 4 6 8 6 12s-2 8-6 12M16 4c-4 4-6 8-6 12s2 8 6 12"/></symbol>
  </defs>

  <rect width="1600" height="930" fill="#f7fafc"/>
  <text x="55" y="39" class="title">Hub-and-spoke landing zone</text>

  <rect x="55" y="62" width="1490" height="250" rx="25" fill="#f2fbfc" stroke="#00a6b8" stroke-width="3"/>
  <use href="#folder" x="82" y="82" width="30" height="30"/><text x="124" y="104" class="heading">Example Corp organization</text>
  <rect x="82" y="128" width="1436" height="62" rx="14" fill="#edf2f7" stroke="#cad8e3"/>
  <text x="105" y="153" class="label">Folders</text>
  <rect x="220" y="141" width="190" height="36" rx="9" fill="#e7f7fa" stroke="#00a6b8"/><text x="315" y="164" text-anchor="middle" class="tag">platform</text>
  <rect x="555" y="141" width="245" height="36" rx="9" fill="#f0fbf3" stroke="#27a667"/><text x="678" y="164" text-anchor="middle" class="tag">landing_zones_corporate</text>
  <rect x="900" y="141" width="225" height="36" rx="9" fill="#fff7eb" stroke="#ed8b24"/><text x="1013" y="164" text-anchor="middle" class="tag">landing_zones_public</text>
  <rect x="1250" y="141" width="160" height="36" rx="9" fill="#f8f5ff" stroke="#9474c6"/><text x="1330" y="164" text-anchor="middle" class="tag">sandboxes</text>
  <rect x="82" y="210" width="1436" height="76" rx="14" fill="#fff" stroke="#cad8e3"/>
  <text x="105" y="235" class="label">Projects</text>
  <rect x="175" y="232" width="160" height="40" rx="9" fill="#e7f7fa" stroke="#00a6b8" stroke-width="2"/><use href="#management" x="184" y="239" width="25" height="25"/><text x="275" y="257" text-anchor="middle" class="tag">Management</text>
  <rect x="350" y="232" width="160" height="40" rx="9" fill="#e7f7fa" stroke="#00a6b8" stroke-width="2"/><use href="#network" x="359" y="239" width="25" height="25"/><text x="450" y="257" text-anchor="middle" class="tag">Connectivity</text>
  <rect x="585" y="232" width="185" height="40" rx="9" fill="#f0fbf3" stroke="#27a667" stroke-width="2"/><use href="#app" x="595" y="239" width="25" height="25"/><text x="690" y="257" text-anchor="middle" class="tag">Data Platform</text>
  <rect x="900" y="232" width="225" height="40" rx="9" fill="#fff7eb" stroke="#ed8b24" stroke-width="2"/><use href="#app" x="910" y="239" width="25" height="25"/><text x="1025" y="257" text-anchor="middle" class="tag">External API Gateway</text>
  <rect x="1240" y="232" width="180" height="40" rx="9" fill="#f8f5ff" stroke="#9474c6" stroke-width="2"/><use href="#sandbox" x="1249" y="239" width="25" height="25"/><text x="1342" y="257" text-anchor="middle" class="tag">Sandbox Alpha</text>
  <path d="M315 177V204H255V232" class="structure" marker-end="url(#arrow-gray)"/>
  <path d="M315 177V204H430V232" class="structure" marker-end="url(#arrow-gray)"/>
  <path d="M678 177V232" class="structure" marker-end="url(#arrow-gray)"/>
  <path d="M1013 177V232" class="structure" marker-end="url(#arrow-gray)"/>
  <path d="M1330 177V232" class="structure" marker-end="url(#arrow-gray)"/>

  <rect x="55" y="345" width="650" height="505" rx="25" fill="#effafd" stroke="#00a6b8" stroke-width="3"/>
  <use href="#network" x="82" y="370" width="34" height="34"/><text x="128" y="396" class="heading">Platform Landing Zone</text>
  <text x="128" y="420" class="small">Shared management and private connectivity in eu01</text>
  <rect x="82" y="455" width="250" height="330" rx="18" fill="#fff" stroke="#9ed6df" stroke-width="2"/>
  <use href="#management" x="104" y="478" width="32" height="32"/><text x="148" y="501" class="label">Management</text>
  <rect x="104" y="535" width="206" height="54" rx="9" fill="#eef8fa" stroke="#b8dfe5"/><text x="207" y="558" text-anchor="middle" class="tag">State and secrets</text><text x="207" y="577" text-anchor="middle" class="small">platform automation</text>
  <rect x="104" y="612" width="206" height="54" rx="9" fill="#eef8fa" stroke="#b8dfe5"/><text x="207" y="635" text-anchor="middle" class="tag">Organization access</text><text x="207" y="654" text-anchor="middle" class="small">central ownership</text>
  <rect x="357" y="455" width="320" height="330" rx="18" fill="#fff" stroke="#9ed6df" stroke-width="2"/>
  <use href="#network" x="379" y="478" width="32" height="32"/><text x="423" y="501" class="label">Connectivity</text>
  <rect x="379" y="535" width="276" height="62" rx="9" fill="#eef8fa" stroke="#b8dfe5"/><use href="#network" x="393" y="552" width="26" height="26"/><text x="529" y="558" text-anchor="middle" class="tag">Shared Network Area</text><text x="529" y="578" text-anchor="middle" class="small">10.0.0.0/16</text>
  <rect x="379" y="620" width="276" height="56" rx="9" fill="#eef8fa" stroke="#b8dfe5"/><text x="517" y="644" text-anchor="middle" class="tag">Central DNS</text><text x="517" y="663" text-anchor="middle" class="small">example-corp.stackit.run</text>
  <rect x="379" y="699" width="276" height="56" rx="9" fill="#eef8fa" stroke="#b8dfe5"/><text x="517" y="723" text-anchor="middle" class="tag">Transfer network</text><text x="517" y="742" text-anchor="middle" class="small">10.255.0.0/24</text>

  <rect x="745" y="345" width="520" height="255" rx="25" fill="#f0fbf3" stroke="#27a667" stroke-width="3"/>
  <use href="#app" x="772" y="370" width="34" height="34"/><text x="818" y="396" class="heading">Corporate Landing Zone</text>
  <text x="818" y="420" class="small">Data Platform / prod / eu01</text>
  <rect x="775" y="458" width="205" height="72" rx="10" fill="#fff" stroke="#9bd2b1" stroke-width="2"/><use href="#network" x="790" y="479" width="28" height="28"/><text x="892" y="485" text-anchor="middle" class="tag">Private network</text><text x="892" y="506" text-anchor="middle" class="small">10.0.0.0/16 allocation</text>
  <rect x="1010" y="458" width="225" height="72" rx="10" fill="#fff" stroke="#9bd2b1" stroke-width="2"/><use href="#app" x="1025" y="479" width="28" height="28"/><text x="1134" y="485" text-anchor="middle" class="tag">Data workload</text><text x="1134" y="506" text-anchor="middle" class="small">SNA attached / prefix 24</text>
  <rect x="775" y="550" width="460" height="30" rx="8" fill="#fff" stroke="#9bd2b1"/><text x="1005" y="570" text-anchor="middle" class="small">delegated DNS child zone</text>

  <rect x="745" y="630" width="520" height="220" rx="25" fill="#fff7eb" stroke="#ed8b24" stroke-width="3"/>
  <use href="#app" x="772" y="655" width="34" height="34"/><text x="818" y="681" class="heading">Public Landing Zone</text>
  <text x="818" y="705" class="small">External API Gateway / prod / eu01</text>
  <rect x="775" y="742" width="205" height="62" rx="10" fill="#fff" stroke="#f4c57f" stroke-width="2"/><use href="#network" x="790" y="757" width="28" height="28"/><text x="892" y="770" text-anchor="middle" class="tag">Independent network</text><text x="892" y="789" text-anchor="middle" class="small">not attached to SNA</text>
  <rect x="1010" y="742" width="225" height="62" rx="10" fill="#fff" stroke="#f4c57f" stroke-width="2"/><use href="#app" x="1025" y="757" width="28" height="28"/><text x="1134" y="770" text-anchor="middle" class="tag">Public API workload</text><text x="1134" y="789" text-anchor="middle" class="small">direct internet access</text>

  <rect x="1345" y="535" width="170" height="100" rx="50" fill="#edf2f7" stroke="#708397" stroke-width="2"/>
  <use href="#internet" x="1355" y="566" width="34" height="34"/><text x="1455" y="580" text-anchor="middle" class="label">Internet</text><text x="1455" y="602" text-anchor="middle" class="small">public ingress / egress</text>

  <path d="M1010 494H980" class="private-flow" marker-end="url(#arrow-teal)"/>
  <path d="M775 494H705V566H655" class="private-flow" marker-end="url(#arrow-teal)"/>
  <path d="M1235 773H1305V610H1345" class="public-flow" marker-end="url(#arrow-orange)"/>
  <text x="1300" y="735" text-anchor="end" class="small">direct public path</text>
  <g transform="translate(76 905)">
    <line x1="0" y1="0" x2="38" y2="0" class="private-flow"/><text x="50" y="5" class="small">private traffic</text>
    <line x1="190" y1="0" x2="228" y2="0" class="public-flow"/><text x="240" y="5" class="small">direct internet</text>
  </g>
</svg>
