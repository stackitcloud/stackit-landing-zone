<text x="24" y="1877" font-size="16" font-weight="400" fill="#172b3a"><tspan x="24" dy="0">One qualified/skip build feeds Dev and Prod; no rebuild. Historical Dev-only artifacts remain excluded.</tspan><tspan x="24" dy="24">Shared infrastructure workflows choose lzc-dev / lzc-prod; no separate copies. * = source path filter.</tspan><tspan x="24" dy="24">Environment reviewers and branch rules are configured in GitHub. Job conditions still apply; not every cell runs.</tspan><tspan x="24" dy="24">Phase blocks summarize jobs, not a complete dependency DAG. Tests/packaging and staging can run in parallel.</tspan></text>
</g>
</svg>
