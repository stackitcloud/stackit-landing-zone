<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title description">
  <title id="title">Landing Zone Configurator - Architektur auf STACKIT</title>
  <desc id="description">Praesentationsuebersicht: Web UI mit Editor und Chat, Configurator API mit KI-Assistent und OpenTofu-Runner laufen auf STACKIT Cloud Foundry. STACKIT IDP, PostgreSQL Flex, Model Serving und die Landing Zone liegen ebenfalls auf STACKIT. Nur GitHub mit dem Accelerator-Repository liegt ausserhalb.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#667c95"/>
    </marker>
    <style>
      text { font-family: Arial, Helvetica, sans-serif; fill: #19324e; }
      .title { font-size: 38px; font-weight: 700; }
      .subtitle { font-size: 23px; fill: #64788f; }
      .heading { font-size: 26px; font-weight: 700; }
      .caption { font-size: 20px; fill: #526b85; }
      .group { font-size: 23px; font-weight: 700; fill: #2877b5; }
      .card { stroke-width: 1.8; }
      .core { fill: #ffffff; stroke: #70a4cf; }
      .external { fill: #f8fafc; stroke: #c3cfdd; }
      .service { fill: #f2effb; stroke: #b7a8d5; }
      .data { fill: #fff7e9; stroke: #dfc390; }
      .target { fill: #edf8f3; stroke: #89bcaa; }
      .relation { fill: none; stroke: #a1afbe; stroke-width: 2.5; }
      .flow { fill: none; stroke: #667c95; stroke-width: 3; marker-end: url(#arrow); }
    </style>
  </defs>
